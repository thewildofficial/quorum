# One-click Render blueprint (free web service tier).
# Data lives in Postgres (DATABASE_URL) - a free Neon project gives persistence.
# SEED_ON_EMPTY=1 inserts synthetic demo members and events only when the
# events table is empty, so evaluators always see a working app. See DEPLOYMENT.md.
services:
  - type: web
    name: quorum
    runtime: node
    plan: free
    buildCommand: npm --prefix server install --omit=dev --no-audit --no-fund && npm --prefix client install --no-audit --no-fund && npm --prefix client run build
    startCommand: node server/src/index.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: SEED_ON_EMPTY
        value: "1"
      # Quorum seed users cannot log in (Google OAuth required); browsing works publicly.
      # Set DATABASE_URL (Neon connection string) and GOOGLE_CLIENT_ID/SECRET
      # in the Render dashboard - never commit them.
